</style><style>/* ===== mentor: Mr Tycoon ===== */

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen phone game. Flat colour-tile HUD on top, isometric city stage with ONE business centred, info + collect bar at the bottom, tool rail on the right. Single bright flat look by choice. */
:root{
  --green:#3E9B37; --green-d:#2C7526; --lime:#B5D43B; --lime-d:#8FAE24; --sky:#4AAFE3; --sky-d:#2F8DC0;
  --orange:#F06B4B; --orange-d:#C9502F; --grey:#C9C9C9; --teal:#2FA3AE; --cream:#F7F4EC; --paper:#FFFFFF;
  --ink:#2A2A2A; --red:#E04B3A; --price:#D3DE3C; --gold:#F5B946;
  --font:'Montserrat', 'Arial Black', system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden}

/* coin + gem glyphs */
.coin{display:inline-grid;place-items:center;width:1.05em;height:1.05em;border:.13em solid currentColor;border-radius:50%;font-size:.8em;font-style:normal;font-weight:900;line-height:1;flex:none}
.coin::before{content:"$";font-size:.62em}
.gemi{width:.9em;height:.9em;flex:none}

/* HUD tiles */
.hud{display:grid;grid-template-columns:1fr 1.35fr 1fr .8fr;gap:4px;background:var(--paper);padding-bottom:4px}
.t{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;color:#fff;min-width:0;text-align:left}
.t small{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.t b{display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(17px,5.4vw,24px);white-space:nowrap;overflow:hidden}
.t-nw{grid-column:1/4;background:var(--green);padding-left:16px;padding-block:10px}
.t-nw small{color:var(--lime);font-size:12px}
.nwrow{display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:visible}
.rate{display:inline-flex;align-items:center;gap:4px;background:#ffffff26;color:#fff;font-weight:900;font-size:12px;letter-spacing:.2px;text-transform:none;padding:3px 8px;border-radius:999px;white-space:nowrap}
.rate:empty{display:none}
.rate.rboost{background:var(--lime);color:var(--green-d);animation:ratepulse 1.2s ease-in-out infinite}
.t-nw{position:relative;z-index:3}.t-nw small.nwrow{overflow:visible}.rate{position:relative;z-index:4;transform-origin:50% 50%}
#rateFx{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:400}
.rate.rtap{background:#ffffffe6;color:var(--green-d);transition:background .3s}
.rate.rfrozen{background:#00000026;color:#ffffffb3}
@keyframes ratepulse{50%{opacity:.72}}
.t-nw b{font-size:clamp(30px,10vw,42px)}
.t-boss{background:var(--lime);align-items:center;color:var(--green-d);padding-right:16px}
.t-boss svg{width:46px;height:46px;border:3px solid #fff;background:var(--green)}
.t-boss small{font-size:10px}
.t-cry{background:var(--sky);padding-left:16px}
.t-cash{background:var(--lime);transition:transform .15s}
.t-cash.bump{transform:scale(1.06)}
.t-cash b{color:var(--green-d)}
.t-thr{background:var(--grey);transition:background .3s}
.t-thr.hot{background:var(--orange)}
.t-thr.l1{background:#7FD0F2}.t-thr.l1 small,.t-thr.l1 b{color:#0E4D6B}
.t-thr.l2{background:#F5A63A}.t-thr.l3{background:#E04B3A}.t-thr.l4{background:#A8231B}
.t-chest{background:var(--green);align-items:center;padding-right:16px;position:relative}
.t-chest svg{width:42px;height:34px}
.t-chest small{font-size:9px;color:var(--lime)}

/* stage */
#stage{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
#city{position:absolute;inset:0}
#city svg{width:100%;height:100%;display:block}
#city.photo{background:#FFFFFF url(img/bg-day.webp) no-repeat;background-size:cover;background-position:50% 100%}

<script>
(()=>{
/* ================= isometric drawing ================= */
const P=(x,y,z)=>[(x-y)*0.866,(x+y)*0.5-z];
const pts=a=>a.map(p=>P(...p).map(n=>n.toFixed(1)).join(',')).join(' ');
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);
 r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function box(x,y,z,w,d,h,c){
 const T=[[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],L=[[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],R=[[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]];
 return`<polygon points="${pts(L)}" fill="${shade(c,-.04)}"/><polygon points="${pts(R)}" fill="${shade(c,-.2)}"/><polygon points="${pts(T)}" fill="${shade(c,.18)}"/>`}
function winL(x,y,z,w,d,h,rows,cols,c){let s='';for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const u=x+w*(k+.22)/cols,uw=w*.56/cols,v=z+h*(r+.25)/rows,vh=h*.5/rows;
 s+=`<polygon points="${pts([[u,y+d,v],[u+uw,y+d,v],[u+uw,y+d,v+vh],[u,y+d,v+vh]])}" fill="${c}"/>`}return s}
function winR(x,y,z,w,d,h,rows,cols,c){let s='';for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const u=y+d*(k+.22)/cols,uw=d*.56/cols,v=z+h*(r+.25)/rows,vh=h*.5/rows;
 s+=`<polygon points="${pts([[x+w,u,v],[x+w,u+uw,v],[x+w,u+uw,v+vh],[x+w,u,v+vh]])}" fill="${shade(c,-.15)}"/>`}return s}
const ground=(c='#A5D46A')=>box(-62,-62,-7,124,124,7,c);
const ACC=['#F5B946','#5CC6D0','#F07250','#8BC34A','#9E86E0','#4FC3F7','#FF8A65','#E5D13B','#4DB6AC','#EF6F9A'];
const WALL=['#F4E6CF','#FFF3E0','#EDE7F6','#E3F2FD','#FCE4EC','#E8F5E9'];
const GRD=['#A5D46A','#A5D46A','#A5D46A','#A5D46A','#A5D46A'];
function art(b){const a=ACC[b.id%ACC.length],w=WALL[b.id%WALL.length],t=b.vis;let s=ground(GRD[b.w||0]);
 if(t===0){// market stall / cart
  s+=box(-26,-16,20,3,3,32,'#8D6E63')+box(22,-16,20,3,3,32,'#8D6E63');
  s+=box(-28,-18,0,56,36,20,w);
  s+=`<polygon points="${pts([[-28,18,2],[28,18,2],[28,18,18],[-28,18,18]])}" fill="${a}" opacity=".55"/>`;
  for(let i=0;i<4;i++)s+=box(-20+i*10,-6,20,6,6,8,i%2?'#F7D046':a);
  s+=box(-26,13,20,3,3,32,'#8D6E63')+box(22,13,20,3,3,32,'#8D6E63');
  s+=box(-33,-22,52,66,44,5,a);
  s+=box(-30,-20,57,2,2,26,'#6D4C41');const f=[[-30,-20,83],[-30,-4,78],[-30,-20,72]];s+=`<polygon points="${pts(f)}" fill="${shade(a,-.25)}"/>`;
 }else if(t===1){
  s+=box(-36,-30,0,72,60,46,w)+winL(-36,-30,0,72,60,46,1,3,'#9ED6F0');
  s+=`<polygon points="${pts([[-6,30,0],[10,30,0],[10,30,28],[-6,30,28]])}" fill="${shade(a,-.35)}"/>`;
  s+=box(-38,30,30,76,12,4,a)+box(-39,-33,46,78,66,7,shade(a,-.1));
 }else if(t===2){
  s+=box(-36,-36,0,72,72,96,w)+winL(-36,-36,0,72,72,96,4,3,'#7EC8E8')+winR(-36,-36,0,72,72,96,4,3,'#7EC8E8');
  s+=box(-38,-38,96,76,76,6,a)+box(-14,-14,102,24,24,10,'#B0BEC5');
 }else if(t===3){

 }else if(t===4){
  s+=box(-46,-46,0,92,92,14,'#B0BEC5')+box(-26,-26,14,52,52,118,'#90CAF9')+winL(-26,-26,14,52,52,118,7,3,'#E3F2FD')+winR(-26,-26,14,52,52,118,7,3,'#E3F2FD');
  s+=box(-18,-18,132,36,36,60,a)+winL(-18,-18,132,36,36,60,3,2,'#fff')+winR(-18,-18,132,36,36,60,3,2,'#fff')+box(-2,-2,192,4,4,34,'#78909C');
 }else if(t===5){
  s+=box(-46,-46,0,92,92,44,w)+winL(-46,-46,0,92,92,44,1,5,shade(a,-.2))+winR(-46,-46,0,92,92,44,1,5,shade(a,-.2));
  const[cx,cy]=P(0,0,44);s+=`<ellipse cx="${cx}" cy="${cy}" rx="44" ry="22" fill="${shade(w,-.12)}"/><path d="M${cx-38} ${cy}A38 40 0 0 1 ${cx+38} ${cy}A38 19 0 0 1 ${cx-38} ${cy}Z" fill="${a}"/><path d="M${cx-6} ${cy-38}A30 40 0 0 1 ${cx+30} ${cy-8}" stroke="#fff" stroke-opacity=".5" stroke-width="5" fill="none"/>`+box(-2,-2,82,4,4,22,'#F5B946');

 }else{
  s+=box(-46,-46,0,92,92,20,'#5D4037');const ap=[0,0,190],b1=[[-38,38,20],[38,38,20],[38,-38,20]];
  s+=`<polygon points="${pts([[-38,38,20],[38,38,20],ap])}" fill="#F5B946"/><polygon points="${pts([[38,38,20],[38,-38,20],ap])}" fill="#C98F1E"/><circle cx="${P(...ap)[0]}" cy="${P(...ap)[1]}" r="9" fill="#FFF3B0"/>`;
 }
 const top=TOPS[t];
 return`<svg viewBox="-118 ${top} 236 ${80-top}" preserveAspectRatio="xMidYMax meet">${s}</svg>`}
function siteArt(p){let s=box(-56,-56,-7,112,112,7,'#BDBDBD')+box(-50,-50,0,100,100,5,'#E0E0E0');
 s+=box(-44,-48,5,84,7,Math.max(10,12+p*36),'#C98A55')+box(-48,-44,5,7,84,Math.max(10,12+p*36),'#B9784A');
 for(let i=1;i<4;i++){const z=5+i*(Math.max(10,12+p*36))/4;s+=`<polyline points="${pts([[-44,-41,z],[40,-41,z]])}" stroke="#9D6338" stroke-width="1.2" fill="none"/><polyline points="${pts([[-41,-44,z],[-41,40,z]])}" stroke="#8B5530" stroke-width="1.2" fill="none"/>`}
 const post=(x,y)=>box(x,y,0,4,4,26,'#9E9E9E');
 s+=post(-60,-60)+post(56,-60)+post(-60,56);
 const tape=(a,b)=>`<polygon points="${pts([[...a,17],[...b,17],[...b,24],[...a,24]])}" fill="url(#tp)"/>`;
 s+=tape([-58,-58],[58,-58])+tape([-58,-58],[-58,58]);
 s+=post(56,56)+tape([-58,58],[58,58])+tape([58,-58],[58,58]);
 const[cx,cy]=P(0,0,8);
 s+=`<circle cx="${cx}" cy="${cy-6}" r="26" fill="#8BC34A"/><g transform="translate(${cx-11} ${cy-24})" fill="#2C7526"><rect x="6" y="0" width="7" height="20" rx="3.5"/><rect x="2" y="13" width="20" height="16" rx="5"/><rect x="13" y="9" width="5" height="10" rx="2.5"/><rect x="17" y="11" width="5" height="9" rx="2.5"/></g>`;
 return`<svg viewBox="-118 -110 236 190" preserveAspectRatio="xMidYMax meet"><defs><pattern id="tp" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#F7D046"/><rect width="6" height="12" fill="#2A2A2A"/></pattern></defs>${s}</svg>`}
// empty world on the main screen: the same fenced plot as the land cards, SOLD if you have a free plot, FOR SALE if not
function stagePlot(w,st,i){return plotArt(w,st||(freePlots(w)>0?'sold':'sale'),0,i).replace(/^<svg[^>]*>/,'<svg viewBox="-118 -110 236 190" preserveAspectRatio="xMidYMax meet">')}
function lotArt(){let s=box(-60,-60,-7,120,120,7,'#C5DFA3')+box(-56,-56,0,112,112,2,'#D8EBC0');
 s+=box(-4,-4,2,4,4,60,'#8D6E63');const q=[[-30,0,40],[26,0,40],[26,0,62],[-30,0,62]];s+=`<polygon points="${pts(q)}" fill="#fff" stroke="#2C7526" stroke-width="3"/>`;
 const[cx,cy]=P(-2,0,51);s+=`<text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="Montserrat,Arial" font-weight="900" font-size="16" fill="#2C7526">$</text>`;

.dsign{position:absolute;left:50%;top:calc(7% + env(safe-area-inset-top));transform:translateX(-50%);z-index:2;width:220px;text-align:center;transition:opacity .25s}
.dsign .sign b{font-size:44px}
.shine{position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;opacity:0}

.doors.shut .l{animation:lShut .62s cubic-bezier(.55,0,1,.45) both}
.doors.shut .r{animation:rShut .62s cubic-bezier(.55,0,1,.45) both}
.doors.hold .leaf{transform:none}
.doors.hold .shine{animation:shine .7s ease-in-out .1s both}
.doors.hold .med{animation:thud .35s ease-out}
.doors.open .l{animation:lOpen 1s cubic-bezier(.35,.6,.2,1) both}
.doors.open .r{animation:rOpen 1s cubic-bezier(.35,.6,.2,1) both}
.doors.open .dsign{opacity:0}
.doors.shut .dsign{opacity:0;animation:fadeIn .3s ease-out .45s both}
/* doors grow out of the Net Worth box (and shrink back into it) */
.doors.grow,.doors.shrink{transform-origin:var(--ox) var(--oy)}
.doors.shrink .leaf{transform:none}
.doors.grow .l{transform:rotateY(-58deg);filter:brightness(.8)}.doors.grow .r{transform:rotateY(58deg);filter:brightness(.8)}
.doors.slam .l{animation:lSlam .55s cubic-bezier(.55,0,.9,.45) both}.doors.slam .r{animation:rSlam .55s cubic-bezier(.55,0,.9,.45) both}
@keyframes lSlam{from{transform:rotateY(-90deg);filter:brightness(.7)}to{transform:none;filter:none}}
@keyframes rSlam{from{transform:rotateY(90deg);filter:brightness(.7)}to{transform:none;filter:none}}
.doors.grow{animation:grow .62s cubic-bezier(.25,.8,.3,1) both}
.doors.shrink{animation:grow .5s cubic-bezier(.6,0,.85,.4) reverse both}
.doors.grow .dsign{opacity:0;transition:none}.doors.slam .dsign{animation:fadeIn .2s ease-out .4s both}
.doors.shrink .dsign{opacity:0}
@keyframes grow{0%{clip-path:inset(var(--t) var(--r) var(--b) var(--l));transform:scale(.92);opacity:.6}35%{opacity:1}100%{clip-path:inset(0 0 0 0);transform:none;opacity:1}}
.nwb.press{animation:press .25s ease-out}
@keyframes press{50%{transform:scale(.95)}}
@keyframes lShut{from{transform:translateX(-102%)}to{transform:none}}
@keyframes rShut{from{transform:translateX(102%)}to{transform:none}}
@keyframes lOpen{0%{transform:none;filter:brightness(1)}12%{transform:rotateY(4deg)}100%{transform:rotateY(-104deg);filter:brightness(.55)}}
@keyframes rOpen{0%{transform:none;filter:brightness(1)}12%{transform:rotateY(-4deg)}100%{transform:rotateY(104deg);filter:brightness(.55)}}
@keyframes thud{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shine{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#app.jolt{animation:shake .12s linear 2}
@media (max-height:700px){.frames{gap:10px 10px}.sign b{font-size:34px}}

#app{max-width:none;width:100%;height:100%;margin:0;background:transparent;font-family:Montserrat,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;overflow:hidden}
@media (prefers-reduced-motion:reduce){.gstars i,.gpulse,.spark,.club .shine{animation:none!important}}

#app.awarding #view{visibility:hidden}

  const t=b.top-a.top,l=b.left-a.left,r=a.right-b.right,bt=a.bottom-b.bottom;
  d.style.setProperty('--t',t+'px');d.style.setProperty('--l',l+'px');d.style.setProperty('--r',r+'px');d.style.setProperty('--b',bt+'px');
  d.style.setProperty('--ox',(l+b.width/2)+'px');d.style.setProperty('--oy',(t+b.height/2)+'px');
}

/* game → gallery: doors grow out of Net Worth, glint, swing open into the room */
function enterGallery(){
  if(busy)return;busy=true;const d=$('#doors');if(RM){S.screen='gallery';render();busy=false;cover(true);autoAward();return}
  d.className='doors on slam';                                    // doors start edge-on (unseen) and swing shut
  setTimeout(()=>{d.className='doors on hold';thud();S.screen='gallery';render()},550);
  setTimeout(()=>{d.className='doors on open'},550+650);
  setTimeout(()=>{d.className='doors';busy=false;cover(true);autoAward()},550+650+1000);
}
/* gallery → game: doors slam shut, then shrink back into the Net Worth box */
function leaveGallery(){
  if(busy)return;busy=true;const d=$('#doors');{const dm=$('.dim');if(dm)dm.remove()}if(RM){cover(false);S.screen='game';render();busy=false;unmount();return}
  d.className='doors on slam';
  setTimeout(()=>{d.className='doors on hold';thud();cover(false);S.screen='game';render()},550);
  // the doors swing open again onto the game (the room behind is already gone)
  setTimeout(()=>{d.className='doors on open'},550+650);
  setTimeout(()=>{d.className='doors';busy=false;unmount()},550+650+1000);
}
/* wing → wing: shut → hold (emblem glint) → swap the room behind → swing open */
function through(change){
  if(busy)return;if(RM){change();return}busy=true;const d=$('#doors');
  d.className='doors on slam';
  setTimeout(()=>{d.className='doors on hold';$('#app').classList.add('jolt');if(navigator.vibrate)navigator.vibrate(25);setTimeout(()=>$('#app').classList.remove('jolt'),260);change();},550);

function award(){
  if($('.award'))return;
  const a=document.createElement('div');a.className='award';
  const sparks=Array.from({length:14},(_,i)=>`<i class="spark" style="left:${8+Math.random()*84}%;top:${12+Math.random()*70}%;animation-delay:${(Math.random()*2.4).toFixed(2)}s"></i>`).join('');
  a.innerHTML=`${sparks}<div class="ttl">YOU'VE BEEN AWARDED<b>Trillionaire</b></div>
    <div style="position:relative"><span class="cglow"></span>
    <div class="stage" id="stage"><div class="slab" id="slab">
      <div class="face ff">${plaqueFront()}</div>
      <div class="face fb">${plaqueBack()}</div>
      <div class="side sl"></div><div class="side sr"></div><div class="side st"></div><div class="side sb"></div></div></div>
    ${gstars()}</div>
    <div class="floorlight"></div><div class="hint">DRAG TO SPIN · TAP TO FLIP</div><button class="close" data-a="awardClose">CLOSE</button>`;
  $('#app').appendChild(a);$('#app').classList.add('awarding');
  // spin: slow auto-rotation, drag to throw it round, eases back to the slow spin
  let ang=-25,vel=0.35,tilt=0,drag=null,raf,last=performance.now();
  const slab=$('#slab'),stage=$('#stage');
  // vel is degrees per 1/60 s; f scales each step by the real time since the last frame
  const tick=()=>{ const t=performance.now(),f=Math.min(3,(t-last)/16.667);last=t;
    if(flip){ const k=Math.min(1,(t-flip.t0)/650),e=1-Math.pow(1-k,3); ang=flip.from+(flip.to-flip.from)*e; if(k>=1)flip=null; }
    else if(!drag){ vel+= ((RM?0:0.35)-vel)*(1-Math.pow(0.98,f)); ang+=vel*f; tilt*=Math.pow(0.94,f); }
    slab.style.transform=`rotateX(${tilt.toFixed(2)}deg) rotateY(${ang.toFixed(2)}deg)`; raf=requestAnimationFrame(tick); };
  let moved=0,flip=null;
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now()};moved=0;flip=null;stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(16,performance.now()-drag.t);
    moved+=Math.abs(dx)+Math.abs(dy);ang+=dx*0.6;tilt=Math.max(-25,Math.min(25,tilt-dy*0.3));vel=dx*0.6*16/dt;drag={x:e.clientX,y:e.clientY,t:performance.now()}});
  const up=()=>{ if(drag&&moved<8){ flip={from:ang,to:ang+180,t0:performance.now()}; vel=0.35; } drag=null };stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  a._stop=()=>cancelAnimationFrame(raf); tick();
  if(navigator.vibrate)navigator.vibrate([20,60,40]);
}

  }

function travel(w){if(!worldOpen(w))return;plotSel=null;const o=cur();s.wlast=s.wlast||{};if(o)s.wlast[s.world|0]=o.bid;s.world=w;s.wseen=Math.max(s.wseen|0,w);

 s.cash-=p;ev('land',{world:w,price:Math.round(p)});s.landVal=(s.landVal||0)+p;plotSet(w).push(i);s.land[w]=landIn(w);vib(20);toast(`Plot ${i+1} in ${WN[w]} is yours`,'good');save();const sb=$('sb');if(sb&&ovKind==='shop'){const y=sb.scrollTop;sb.innerHTML=shopBody();sb.scrollTop=y}else if(landFromShop){const y=shopY;openShop();const s2=$('sb');if(s2)s2.scrollTop=y}else closeOv();if((s.world|0)===w)plotSel=i;stageSig='';upd()}

 el.hidden=false;const tr=$('mTrack');

 [...$('mTrack').children].forEach((d,i)=>d.classList.toggle('on',i===mapIdx));[...$('mDots').children].forEach((d,i)=>d.classList.toggle('on',i===mapIdx));
