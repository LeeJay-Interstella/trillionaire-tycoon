<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3E9B37"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trillionaire"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><script src="config.js"></script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Trillionaire Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen phone game. Flat colour-tile HUD on top, isometric city stage with ONE business centred, info + collect bar at the bottom, tool rail on the right. Single bright flat look by choice. */
:root{
  --green:#3E9B37; --green-d:#2C7526; --lime:#B5D43B; --lime-d:#8FAE24; --sky:#4AAFE3; --sky-d:#2F8DC0;
  --orange:#F06B4B; --orange-d:#C9502F; --grey:#C9C9C9; --teal:#2FA3AE; --cream:#F7F4EC; --paper:#FFFFFF;
  --ink:#2A2A2A; --red:#E04B3A; --price:#D3DE3C; --gold:#F5B946;
  --font:'Montserrat', 'Arial Black', system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden}

/* coin + gem glyphs */
.coin{display:inline-grid;place-items:center;width:1.05em;height:1.05em;border:.13em solid currentColor;border-radius:50%;font-size:.8em;font-style:normal;font-weight:900;line-height:1;flex:none}
.coin::before{content:"$";font-size:.62em}
.gemi{width:.9em;height:.9em;flex:none}

/* HUD tiles */
.hud{display:grid;grid-template-columns:1fr 1.35fr 1fr .8fr;gap:4px;background:var(--paper);padding-bottom:4px}
.t{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;color:#fff;min-width:0;text-align:left}
.t small{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.t b{display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(17px,5.4vw,24px);white-space:nowrap;overflow:hidden}
.t-nw{grid-column:1/4;background:var(--green);padding-left:16px;padding-block:10px}
.t-nw small{color:var(--lime);font-size:12px}
.nwrow{display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:visible}
.rate{display:inline-flex;align-items:center;gap:4px;background:#ffffff26;color:#fff;font-weight:900;font-size:12px;letter-spacing:.2px;text-transform:none;padding:3px 8px;border-radius:999px;white-space:nowrap}
.rate:empty{display:none}
.rate.rboost{background:var(--lime);color:var(--green-d);animation:ratepulse 1.2s ease-in-out infinite}
.rate.rfrozen{background:#00000026;color:#ffffffb3}
@keyframes ratepulse{50%{opacity:.72}}
.t-nw b{font-size:clamp(30px,10vw,42px)}
.t-boss{background:var(--lime);align-items:center;color:var(--green-d);padding-right:16px}
.t-boss svg{width:46px;height:46px;border:3px solid #fff;background:var(--green)}
.t-boss small{font-size:10px}
.t-cry{background:var(--sky);padding-left:16px}
.t-cash{background:var(--lime);transition:transform .15s}
.t-cash.bump{transform:scale(1.06)}
.t-cash b{color:var(--green-d)}
.t-thr{background:var(--grey);transition:background .3s}
.t-thr.hot{background:var(--orange)}
.t-thr.l1{background:#7FD0F2}.t-thr.l1 small,.t-thr.l1 b{color:#0E4D6B}
.t-thr.l2{background:#F5A63A}.t-thr.l3{background:#E04B3A}.t-thr.l4{background:#A8231B}
.t-chest{background:var(--green);align-items:center;padding-right:16px;position:relative}
.t-chest svg{width:42px;height:34px}
.t-chest small{font-size:9px;color:var(--lime)}

/* stage */
#stage{flex:1;position:relative;overflow:hidden;min-height:0}
#city{position:absolute;inset:0}
#city svg{width:100%;height:100%;display:block}
#art{position:absolute;inset:0;pointer-events:none;z-index:2}
#art svg{width:100%;height:100%;display:block}
#art .hit{cursor:pointer}
#art.pop{animation:pop .12s}
@keyframes pop{50%{filter:brightness(1.12)}}

.callout{position:absolute;left:50%;transform:translateX(-50%);top:4%;display:flex;flex-direction:column;align-items:stretch;pointer-events:none;z-index:4;filter:drop-shadow(0 4px 0 #0002)}
.callout .timer{background:var(--green);color:#fff;font-weight:800;font-size:15px;text-align:center;padding:5px 10px}
.callout .lbl{background:var(--orange);color:#fff;font-weight:900;font-size:clamp(16px,5vw,22px);padding:10px 16px;text-align:center;white-space:nowrap;position:relative}
.callout .lbl::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-bottom:0;border-top-color:var(--orange)}
.getmore{position:absolute;right:60px;top:3%;z-index:4;display:flex;align-items:center;filter:drop-shadow(0 4px 0 #0002);animation:nudge 1s ease-in-out infinite}
.getmore span{background:var(--orange);color:#fff;font-weight:900;font-size:clamp(14px,4.4vw,19px);line-height:1.1;padding:10px 12px 10px 16px;text-align:center}
.getmore i{width:0;height:0;border-top:26px solid transparent;border-bottom:26px solid transparent;border-left:20px solid var(--orange)}
@keyframes nudge{50%{transform:translateX(6px)}}

.tools{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:12%;display:flex;flex-direction:column;gap:8px;z-index:5}
.tool{width:44px;height:44px;background:var(--green);border:2px solid #fff;display:grid;place-items:center;position:relative;box-shadow:0 3px 0 var(--green-d)}
.tool svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d)}
.tag{position:absolute;top:-8px;left:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:2px 4px;letter-spacing:.3px}
.tag.lime{background:var(--lime);color:var(--green-d)}
.dot{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.tag.sm{font-size:8px;top:auto;bottom:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink)}

.tube{display:none;position:absolute;right:66px;bottom:3%;top:4%;width:46px;z-index:2;pointer-events:none;
 background:linear-gradient(90deg,#d0d0d066 0,#ffffffd0 22%,#ececece0 50%,#cfcfcfd0 51%,#bdbdbd80 100%);
 -webkit-mask:linear-gradient(0deg,#000 0,#000 55%,#0000 100%);mask:linear-gradient(0deg,#000 0,#000 55%,#0000 100%)}
#column{position:absolute;left:var(--pilex,62%);bottom:var(--pileb,28%);top:2%;width:var(--bw,62px);pointer-events:none;z-index:3}
.bill{position:absolute;left:0;width:var(--bw,62px);height:var(--bh,37px);transform-origin:50% 80%}
#column:empty::before{display:none}
#column::before{content:"";position:absolute;left:4px;right:2px;bottom:-6px;height:20px;border-radius:50%;background:#0000001f}
.bill svg{width:100%;height:100%;display:block}
.fall{position:absolute;left:var(--pilex,62%);width:var(--bw,62px);height:var(--bh,37px);will-change:transform;z-index:3;pointer-events:none}
.fly{position:fixed;width:var(--bw,62px);height:var(--bh,37px);will-change:transform;z-index:60;pointer-events:none}
.fullflag{position:absolute;left:calc(var(--pilex,62%) + 2px);background:var(--red);color:#fff;font-weight:900;font-size:12px;padding:3px 8px;z-index:4;animation:nudge 1s infinite}

.arrow{position:absolute;top:44%;width:38px;height:38px;border-radius:50%;background:#ffffffd9;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;z-index:5;box-shadow:0 3px 0 #0001}
.arrow svg{width:18px;height:18px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arrow.l{left:max(10px,env(safe-area-inset-left,0px))}
.arrow.r{right:62px;top:auto;bottom:4%}
.pager{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;background:#ffffffd9;border:2px solid var(--green);color:var(--green);font-weight:900;font-size:12px;padding:4px 9px;z-index:5}
.rounds{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:3%;display:flex;gap:10px;z-index:5}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 0 #0002;border:3px solid #fff}
.round svg{width:26px;height:26px;fill:#fff}
.round.sell{background:var(--orange)} .round.up{background:var(--green)}
.round.up.can{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #3E9B3744}}
.boost{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:44px;background:var(--gold);color:var(--ink);font-weight:900;font-size:12px;padding:5px 9px;z-index:5;box-shadow:0 3px 0 #0002}

/* bottom panel */
#panel{background:var(--cream);padding:6px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;position:relative}
.info{display:flex;gap:14px;align-items:flex-start;min-width:0}
.ribbon{flex:none;width:58px;display:flex;flex-direction:column;align-items:center}
.ribbon small{background:var(--lime);color:var(--green-d);font-size:10px;font-weight:900;width:100%;text-align:center;padding:2px 0}
.ribbon b{background:var(--teal);color:#fff;font-size:28px;font-weight:900;width:100%;text-align:center;padding:4px 0 14px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.info h2{margin:0 0 4px;color:var(--teal);font-weight:900;font-size:clamp(18px,5.6vw,24px);line-height:1.05;text-transform:uppercase;text-wrap:balance}
.lines{display:grid;grid-template-columns:auto auto 1fr;column-gap:6px;font-weight:700;font-size:14px;line-height:1.45}
.lines .g{color:var(--green)} .lines .k{color:var(--ink)} .lines .r{color:var(--red)} .lines .c{color:var(--green)}
.collect{display:flex;height:64px;box-shadow:0 5px 0 var(--green-d);cursor:pointer;transition:transform .06s}
.collect:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.collect .amt{flex:1;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding-left:16px;font-weight:900;font-size:clamp(24px,8vw,32px);min-width:0;overflow:hidden;white-space:nowrap}
.collect button{width:118px;background:var(--lime);color:var(--green-d);font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.collect button .coin{font-size:24px}
.collect button.full{animation:flash .7s infinite}
@keyframes flash{50%{background:#E2F27A}}
.collect button{pointer-events:none}
.finish{display:flex;align-items:center;height:64px;background:var(--sky);color:#fff;box-shadow:0 5px 0 var(--sky-d);width:100%;padding:0 16px;gap:14px}
.finish svg.ff{width:38px;height:30px;fill:#fff}
.finish div{flex:1;display:flex;flex-direction:column;align-items:center;font-weight:900}
.finish small{font-size:13px}
.finish b{font-size:26px;display:flex;align-items:center;gap:8px}
.finish:disabled{background:#9CCBE6}
.uc{display:flex;gap:16px;align-items:center}
.uc svg{width:46px;height:46px;flex:none}
.uc h2{margin:0;color:var(--teal);font-weight:900;font-size:clamp(18px,5.6vw,24px);text-transform:uppercase;line-height:1.1}
.uc p{margin:2px 0 0;color:var(--gold);font-weight:900;font-size:clamp(16px,5vw,22px);text-transform:uppercase}
.bigbtn{display:block;width:100%;padding:18px;background:var(--lime);color:var(--green-d);font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--lime-d);text-transform:uppercase}
.gear{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + 64px + 18px);width:34px;height:34px;border-radius:50%;background:#E6E2D6;display:grid;place-items:center;z-index:6}
.gear svg{width:20px;height:20px;fill:#8A8676}
.info{padding-right:40px}
.floaty{position:fixed;z-index:70;pointer-events:none;font-weight:900;font-size:20px;color:var(--green);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translateY(-56px);opacity:0}}

/* overlays */
#ovl:empty{display:none}
.dim{position:absolute;inset:0;z-index:40;background:#5f5f5f99;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{width:100%;max-width:380px;background:var(--lime);padding:8px;box-shadow:0 10px 30px #0004;animation:in .18s ease-out;max-height:92%;display:flex;flex-direction:column}
@keyframes in{from{transform:scale(.9);opacity:0}}
.dlg h3{margin:0;padding:10px 8px 14px;color:var(--green);font-weight:900;font-size:clamp(17px,5.4vw,23px);text-align:center;text-transform:uppercase;line-height:1.1}
.dlg .body{background:#fff;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;overflow:auto}
.dlg p{margin:0;font-weight:700;font-size:16px;line-height:1.4}
.dlg p.s{font-size:13px;font-weight:600;color:#6b6b6b}
.dlg .pic{width:150px;height:150px}
.dlg .pic svg{width:100%;height:100%}
.hl{color:var(--teal);font-weight:900}
.hlg{color:var(--green);font-weight:900}
.btns{display:flex;gap:12px;width:100%}
.btns button{flex:1;padding:16px 8px;color:#fff;font-weight:900;font-size:clamp(18px,6vw,26px);text-transform:uppercase}
.no{background:var(--orange)} .yes{background:var(--green)} .ok{background:var(--sky)}
.yes:disabled{background:#a9c9a5}
.cmp{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:14px;font-weight:700;text-align:left}
.cmp span:nth-child(3n){color:var(--green)}
input.nm{width:100%;border:3px solid var(--lime);padding:12px;font:inherit;font-weight:800;font-size:18px;text-align:center;color:var(--ink);background:#fff}
input.nm:focus{outline:none;border-color:var(--green)}

.sheet{position:absolute;inset:0;z-index:40;background:#5f5f5f99;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-in{margin-top:auto;height:92%;background:#fff;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{background:var(--green);color:#fff;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h3{flex:1;margin:0;text-align:center;font-weight:900;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
.sheet-h svg{width:26px;height:26px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}
.sheet-b{flex:1;overflow:auto;background:#E7E7E2;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.tierh{background:var(--green-d);color:#fff;font-weight:900;font-size:13px;letter-spacing:.6px;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;text-transform:uppercase}
.tierh span{color:var(--lime)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}
.card{background:#fff;display:flex;flex-direction:column;padding:10px 10px 0;min-width:0;border:2px solid #E1EBC9}
.card h4{margin:0;color:var(--teal);font-weight:900;font-size:14px;text-align:center;text-transform:uppercase;line-height:1.1;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.card .pic{height:92px;margin:4px 0}
.card .pic svg{width:100%;height:100%}
.card .tier{align-self:flex-start;background:var(--green-d);color:#fff;font-size:10px;font-weight:900;padding:2px 6px;margin-bottom:4px}
.card .st{display:grid;grid-template-columns:auto auto 1fr;column-gap:4px;font-size:11.5px;font-weight:700;line-height:1.45}
.card .st .g{color:var(--green)} .card .st .r{color:var(--red)}
.card .price{margin:8px -10px 0;background:var(--price);color:var(--green-d);font-weight:900;font-size:17px;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:8px}
.card .price.off{background:#E5E5E5;color:#9a9a9a}
.card .price.own{background:var(--sky);color:#fff;font-size:13px}
.card.locked{background:#F3F3EE}
.card.locked .pic{opacity:.85;filter:saturate(.75)}
.card.secret h4{color:#999}
.lb{display:grid;grid-template-columns:40px 42px 1fr auto;gap:10px;align-items:center;background:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid #E7E7E2}
.lb.you{background:#F1F8DC}
.lb .pos{font-weight:900;font-size:18px;color:#9a9a9a;text-align:center}
.lb.top .pos{color:var(--gold)}
.lb .av{width:42px;height:42px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px}
.lb .who{min-width:0}
.lb .who b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who small{color:#888;font-weight:700;font-size:11px;text-transform:uppercase}
.lb .v{font-weight:900;color:var(--green);display:flex;align-items:center;gap:8px}
.lb.fr{background:#FFF6EE}.dark .lb.fr{background:#2A2219}
.frx{width:32px;height:32px;border:0;border-radius:50%;background:#EFEDE6;color:#8A8676;font-weight:900;font-size:13px;cursor:pointer;flex:none}
.dark .frx{background:#263031;color:#A3ABA6}
.code{font-weight:900;font-size:clamp(22px,7vw,30px);letter-spacing:2px;white-space:nowrap;color:var(--green);background:#F1F8DC;padding:14px 18px;width:100%;text-align:center;user-select:text;-webkit-user-select:text}
.dark .code{background:#22301F}
.tabs2{display:flex;gap:4px;padding:6px}
.tabs2 button{flex:1;padding:9px 4px;background:#fff;font-weight:800;font-size:12px;color:#777;text-transform:uppercase}
.tabs2 button.on{background:var(--lime);color:var(--green-d)}
.mail{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid #E7E7E2}
.mail .ic{width:44px;height:44px;display:grid;place-items:center;background:#E7E7E2;color:#aaa;font-weight:900;font-size:20px}
.mail.ready .ic,.mail.done .ic{background:var(--gold);color:#fff}
.mail b{display:block;font-weight:800}
.mail small{color:#777;font-weight:600;font-size:12px}
.mail button{background:var(--lime);color:var(--green-d);font-weight:900;padding:9px 12px;display:flex;align-items:center;gap:5px;font-size:13px}
.mail button:disabled{background:#eee;color:#aaa}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}
.statgrid div{background:#fff;padding:12px 14px}
.statgrid small{display:block;font-size:10px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:.5px}
.statgrid b{font-weight:900;font-size:17px;color:var(--green)}
.pad{padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pad p{margin:0;font-weight:600;line-height:1.5;font-size:14px}
.pad .bigbtn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #ccc}
.pad .bigbtn.danger{background:#fff;color:var(--red);box-shadow:0 4px 0 #e6b3ab}

/* splash, jail */
.fullscreen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#splash{background:var(--green);cursor:pointer}
.logo span{font-size:1.25em;color:var(--lime);text-shadow:0 6px 0 var(--lime-d)}
.logo{position:relative;text-align:center;align-self:center;font-weight:900;font-size:clamp(34px,10.4vw,70px);letter-spacing:-1px;color:#fff;letter-spacing:-2px;line-height:.9;text-shadow:0 6px 0 var(--green-d);z-index:2}

<script>
(()=>{
/* ================= isometric drawing ================= */
const P=(x,y,z)=>[(x-y)*0.866,(x+y)*0.5-z];
const pts=a=>a.map(p=>P(...p).map(n=>n.toFixed(1)).join(',')).join(' ');
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);
 r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function box(x,y,z,w,d,h,c){
 const T=[[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],L=[[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],R=[[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]];
 return`<polygon points="${pts(L)}" fill="${shade(c,-.04)}"/><polygon points="${pts(R)}" fill="${shade(c,-.2)}"/><polygon points="${pts(T)}" fill="${shade(c,.18)}"/>`}
function winL(x,y,z,w,d,h,rows,cols,c){let s='';for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const u=x+w*(k+.22)/cols,uw=w*.56/cols,v=z+h*(r+.25)/rows,vh=h*.5/rows;
 s+=`<polygon points="${pts([[u,y+d,v],[u+uw,y+d,v],[u+uw,y+d,v+vh],[u,y+d,v+vh]])}" fill="${c}"/>`}return s}
function winR(x,y,z,w,d,h,rows,cols,c){let s='';for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const u=y+d*(k+.22)/cols,uw=d*.56/cols,v=z+h*(r+.25)/rows,vh=h*.5/rows;
 s+=`<polygon points="${pts([[x+w,u,v],[x+w,u+uw,v],[x+w,u+uw,v+vh],[x+w,u,v+vh]])}" fill="${shade(c,-.15)}"/>`}return s}
const ground=(c='#A5D46A')=>box(-62,-62,-7,124,124,7,c);
const ACC=['#F5B946','#5CC6D0','#F07250','#8BC34A','#9E86E0','#4FC3F7','#FF8A65','#E5D13B','#4DB6AC','#EF6F9A'];
const WALL=['#F4E6CF','#FFF3E0','#EDE7F6','#E3F2FD','#FCE4EC','#E8F5E9'];
function art(b){const a=ACC[b.id%ACC.length],w=WALL[b.id%WALL.length],t=b.vis;let s=ground();
 if(t===0){// market stall / cart

/* ================= cloud save (Supabase) ================= */
// Accounts turn on when config.js (next to index.html) sets your Supabase project URL and anon key.
// Without it, the game saves on this device only, exactly as before.
const CFG=window.TRILLIONAIRE_CONFIG||{};
const SUPABASE_URL=String(CFG.supabaseUrl||'').trim();
const SUPABASE_ANON_KEY=String(CFG.supabaseAnonKey||'').trim();
let supa=null,cloudUser=null,cloudState='idle',lastSync=0,lastPushedAt=0,pendingRemote=null,pushing=false;
const cloudOn=()=>!!(SUPABASE_URL&&SUPABASE_ANON_KEY);
function loadSupabase(){return new Promise((ok,no)=>{if(window.supabase)return ok();const sc=document.createElement('script');
 sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';sc.onload=()=>ok();sc.onerror=no;document.head.appendChild(sc)})}
// ask the server what time it really is; the phone's clock can be changed
async function syncClock(){if(!supa){if(CLOCK_GUARD&&cloudOn())cloudInitClockOnly();return clockGo()}try{const t0=Date.now(),{data,error}=await supa.rpc('server_now'),t1=Date.now();if(error||!data)return clockGo();
 const sv=Number(data);if(!(sv>1.7e12&&sv<4e12))return clockGo(); // ignore anything that isn't a sensible timestamp
 const off=sv-(t0+t1)/2;clockOff=Math.abs(off)>60000?off:0;clockAnchor={srv:Date.now()+clockOff,perf:performance.now()};clockChecked=true;
 const real=Date.now()+clockOff;const rec=s.pm?reconcilePM(real):false;s.verT=Math.max(s.verT||0,Math.min(real,s.maxT||real));sanitizeTime(s);/* if the phone ran ahead, the game simply pauses until real time catches up (at most 2 hours) */clockGo();if(!rec)clockNote()}catch(e){clockGo()}}
let clockWarned=false;
function clockNote(){const ahead=(s.maxT||0)-(Date.now()+clockOff);if(ahead>10*6e4&&!clockWarned&&!ovKind){clockWarned=true;
 dialog('Clock check',`<p>Your phone's date or time was changed.</p><p class="s">The game runs on real time, so it's paused for <span class="hl">${dur(ahead/1000)}</span> until real time catches up. Nothing is lost.</p>`,`<button class="ok" data-act="close">OK</button>`)}}
let clockLoading=false;
async function cloudInitClockOnly(){if(clockLoading||supa)return;clockLoading=true;try{await cloudInit()}catch(e){}clockLoading=false} // the first try failed (offline): try again
async function cloudInit(){if(!cloudOn())return;try{await loadSupabase()}catch(e){cloudState='error';clockGo();return}
 supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'trillionaire.auth'}});
 const {data}=await supa.auth.getSession();cloudUser=data?.session?.user||null;
 supa.auth.onAuthStateChange((ev,ses)=>{cloudUser=ses?.user||null;refreshAcct()});
 await syncClock();
 await swInit();
 if(cloudUser){await cloudPull(bootSavedAt);pushSync().catch(()=>{});loadFriends()}

async function cloudPush(){if(!supa||!cloudUser||pushing||pendingRemote||s.pm)return;pushing=true;cloudState='syncing';refreshAcct();
 try{s.notify=notifyInfo();save();const body=JSON.parse(pack(s));const {error}=await supa.from('saves').upsert({user_id:cloudUser.id,data:body,updated_at:new Date().toISOString()});
  if(error)throw error;lastPushedAt=s.savedAt;lastSync=now();cloudState='ok';
  supa.from('profiles').upsert({user_id:cloudUser.id,build:BUILD,name:(s.name||'Boss').slice(0,20),net_worth:nw(),tier:s.tier,businesses:s.owned.length,last_played:new Date().toISOString()}).then(()=>{},()=>{})}catch(e){cloudState='error'}pushing=false;refreshAcct()}
async function cloudFetch(){const {data,error}=await supa.from('saves').select('*').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(!data)return null;const r=unpack(data.data);if(r)r._bf=data.blocked_from||null;return r}
const hasProgress=st=>st.owned.length>0||(st.earned||0)>0;
const nwOf=st=>st.cash+st.owned.reduce((a,o)=>a+(o.stored||0)+(o.inv||0),0);
// baseline: the timestamp of the save this device last knew about. A newer cloud save means another device played since.
async function cloudPull(baseline,askIfBoth){if(!supa||!cloudUser)return;await syncClock();cloudState='syncing';refreshAcct();
 try{const remote=await cloudFetch();const bf=remote&&remote._bf;if(remote)delete remote._bf;
  if(remote&&bf&&!oldDone&&!bootBuild&&hasProgress(s)&&bootSavedAt>Date.parse(bf)){oldDone=true;oldCopy(remote);return}oldDone=true;
  if(!remote||!hasProgress(remote)){await cloudPush();return}
  if(!hasProgress(s)){adopt(remote,'Loaded your saved game');return}
  if(askIfBoth&&Math.abs((remote.savedAt||0)-(s.savedAt||0))>1000){chooseSave(remote);return}
  if((remote.savedAt||0)>baseline+1000){adopt(remote,'Picked up where you left off on your other device');return}
  await cloudPush()}catch(e){cloudState='error';refreshAcct()}}
function adopt(remote,msg){s=remote;sanitizeTime(s);save();lastPushedAt=s.savedAt;lastSync=now();cloudState='ok';lastRank=null;pendingRemote=null;
 if(ovKind!=='jail'&&ovKind!=='splash')closeOv();if(s.jail&&ovKind!=='splash')openJail();upd();toast(msg,'good')}
function chooseSave(remote){pendingRemote=remote;const ago=t=>t?dur((now()-t)/1000)+' ago':'unknown';
 dialog('Two saves found',`<p class="s">This device and your account have different progress. Choose which one to keep. The other is replaced.</p>
 <div class="cmp num"><span><b>This device</b></span><span></span><span></span><span>Net worth</span><span></span><span>${$m(nwOf(s))}</span><span>Businesses</span><span></span><span>${s.owned.length}</span><span>Last played</span><span></span><span style="color:var(--ink)">${ago(s.savedAt)}</span>
 <span style="margin-top:8px"><b>Your account</b></span><span></span><span></span><span>Net worth</span><span></span><span>${$m(nwOf(remote))}</span><span>Businesses</span><span></span><span>${remote.owned.length}</span><span>Last played</span><span></span><span style="color:var(--ink)">${ago(remote.savedAt)}</span></div>`,
 `<button class="no" data-act="keeplocal" style="font-size:16px">Keep this device</button><button class="yes" data-act="useremote" style="font-size:16px">Use account</button>`,'choose')}

/* ================= push notifications ================= */
// Turned on when config.js has vapidPublicKey and the game runs as a home-screen app with an account.
const VAPID=String(CFG.vapidPublicKey||'').trim();
let swReg=null,pushOn=false,isAway=false;
const NASK='trillionaire.notifAsk';
const pushCapable=()=>!!(VAPID&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window);
function notifState(){if(!VAPID||!cloudOn())return'off';if(!pushCapable())return'unsupported';if(Notification.permission==='denied')return'blocked';
 if(!cloudUser)return'signin';return Notification.permission==='granted'&&pushOn?'on':'ask'}
async function swInit(){if(!VAPID||!('serviceWorker' in navigator))return;try{swReg=await navigator.serviceWorker.register('sw.js');
  swReg.getNotifications?.().then(ns=>ns.forEach(n=>n.close())).catch(()=>{})}catch(e){swReg=null}}
function b64u(x){const p='='.repeat((4-x.length%4)%4),b=atob((x+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushSync(){if(!swReg||!supa||!cloudUser||!pushCapable()||Notification.permission!=='granted')return false;
 let sub=await swReg.pushManager.getSubscription();if(!sub)sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
 const j=sub.toJSON();const {error}=await supa.from('push_subs').upsert({endpoint:j.endpoint,user_id:cloudUser.id,subscription:j});pushOn=!error;refreshAcct();return pushOn}
// Must run straight from a tap: iPhone only shows the Allow prompt in response to one.
function enablePush(){if(!pushCapable()){closeOv();return toast('Add the game to your Home Screen to get notifications.')}
 let req;try{req=Notification.requestPermission()}catch(e){req=Promise.resolve(Notification.permission)}
 Promise.resolve(req).then(async p=>{try{localStorage.setItem(NASK,String(now()))}catch(e){}
  if(p!=='granted'){closeOv();refreshAcct();return toast('Notifications are off. You can turn them on in iPhone Settings later.')}
  if(!swReg)await swInit();
  try{const ok=await pushSync();if(ok){closeOv();cloudPush();toast("Notifications on. We'll tell you when cash is ready.",'good')}else throw 0}
  catch(e){closeOv();toast("Couldn't turn on notifications. Check you're online and try again.",'bad')}})}
async function disablePush(){try{const sub=await swReg?.pushManager.getSubscription();if(sub){await supa?.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}pushOn=false;refreshAcct()}
function notifyPrompt(force){const st=notifState();if(st!=='ask')return false;
 if(!force){let last=0;try{last=+localStorage.getItem(NASK)||0}catch(e){}if(now()-last<3*864e5)return false}
 dialog('Never miss a payday',`<p>Get a notification when:</p><div class="cmp" style="grid-template-columns:1fr"><span>• a business is full and ready to collect</span><span>• construction or an upgrade finishes</span><span>• you get busted, and when you're released</span><span>• your daily chance is ready</span></div><p class="s">You'll get one each time a business fills, so you can empty it straight away.</p>`,
  `<button class="no" data-act="notiflater" style="font-size:16px">Not now</button><button class="yes" data-act="notifon" style="font-size:16px">Turn on</button>`,'notif');return true}
// When things will happen, so the server knows when to ping. Recomputed on every sync.
function notifyInfo(){const t=now(),out={away:!!isAway};const jailEnd=s.jail&&s.jail.until>t?s.jail.until:0;if(jailEnd)out.jailAt=jailEnd;
 let build=null,mgrSafe=0;const fulls=[];
 for(const o of s.owned){const b=B[o.bid],x=st(o);
  if(o.busy&&(!build||o.end<build.at))build={at:o.end,name:b.name,kind:o.busy,level:o.level+1};
  if(!(x.rate>0))continue;let start=o.busy?o.end:t;if(jailEnd&&start<jailEnd)start=jailEnd;const stored=o.busy?0:(o.stored||0);
  const fillAt=start+(x.hold-stored)/x.rate*60000;
  if(mgrOn()){mgrSafe+=(o.safe||0)+x.rate*(1-commission())*Math.max(0,s.mgrUntil-Math.max(fillAt,t))/60000;
   // a manager keeps it earning, so it only counts as full once the shift ends
   fulls.push({at:Math.round(Math.max(fillAt,s.mgrUntil)),name:b.name,amount:money(x.hold+(o.safe||0)+x.rate*Math.max(0,s.mgrUntil-Math.max(fillAt,t))/60000)});continue}
  if(!o.busy&&stored>=x.hold-1e-9)continue;
  fulls.push({at:Math.round(fillAt),name:b.name,amount:money(x.hold)})}
 if(mgrOn()){out.mgrEndAt=Math.round(s.mgrUntil);out.mgrReport=1;out.mgrSafe=money(mgrSafe);out.mgrName=mgrName(s.mgrTotal/36e5).toLowerCase()}
 // daily chance: remind at 8am on the day the next pick is ready
 out.dailyAt=dayStart(t,dcReady()?0:1)+8*36e5;out.dailyDay=dcReady()?dcAlive()+1:s.dc.streak+1;
 // every business's fill time, soonest first, so the server can name whichever ones fill
 // the next arrest, if your threat means one is coming: notify when it happens, and when you're released
 if(!jailEnd){const bp=bustPlan();if(bp){out.bustAt=bp.at;out.bustFor=bp.sec<3600?Math.round(bp.sec/60)+' minutes':(Math.round(bp.sec/1800)/2)+(bp.sec<5400?' hour':' hours');out.bustLoss=bp.loss;out.bustCard=(s.perks.jail||0)>0;out.jailAt=bp.until;
  for(const f of fulls)if(f.at>bp.at)f.at+=bp.until-bp.at}} // businesses are frozen while you're in jail
 fulls.sort((p,q)=>p.at-q.at);out.fulls=fulls.slice(0,60);
 if(build){out.buildAt=Math.round(build.at);out.buildName=build.name;out.buildKind=build.kind;out.buildLevel=build.level}
 return out}
function notifRow(){const st=notifState();if(st==='off')return'';
 const txt={unsupported:['Notifications','Open the game from its Home Screen icon to turn these on.'],blocked:['Notifications are blocked','Turn them on in iPhone Settings › Notifications › Trillionaire.'],signin:['Notifications','Sign in above to get notified when cash is ready.'],ask:['Notifications','Get told when cash is full, builds finish, you get busted or released, or your daily chance is ready.'],on:['Notifications are on',"We'll ping you when cash is ready."]}[st];
 const btn=st==='ask'?`<button class="bigbtn" data-act="notifon" style="padding:10px 14px;font-size:13px;width:auto">Turn on</button>`:st==='on'?`<button class="bigbtn ghost" data-act="notifoff" style="padding:10px 14px;font-size:13px;width:auto">Turn off</button>`:'';
 return`<div class="pad" style="padding-bottom:0;padding-top:8px"><div class="acct"><div style="min-width:0"><b>${txt[0]}</b><small>${txt[1]}</small></div>${btn}</div></div>`}

function acctHTML(){if(!cloudOn())return'';
 if(!cloudUser)return`<div class="pad" style="padding-bottom:0"><div class="acct"><div><b>Save to the cloud</b><small>Sign in to keep your progress synced on every device.</small></div><button class="bigbtn" data-act="auth" data-v="in" style="padding:12px 16px;font-size:15px;width:auto">Sign in</button></div></div>`;
 return`<div class="pad" style="padding-bottom:0"><div class="acct"><div style="min-width:0"><b>${esc(cloudUser.email||'Signed in')}</b><small id="syncst">${syncText()}</small></div><div style="display:flex;gap:6px"><button class="bigbtn ghost" data-act="syncnow" style="padding:10px 12px;font-size:13px;width:auto">Sync now</button><button class="bigbtn ghost" data-act="signout" style="padding:10px 12px;font-size:13px;width:auto">Sign out</button></div></div></div>`}

function authDlg(mode){const up=mode==='up';
 dialog(up?'Create account':'Sign in',`<p class="s">${up?'Make an account to save your progress online.':'Sign in to load your progress on this device.'}</p>
 <input class="nm" id="ae" type="email" aria-label="Email" placeholder="Email" autocomplete="email" autocapitalize="off" style="text-align:left;font-size:16px">
 <input class="nm" id="ap" type="password" aria-label="Password" placeholder="Password, 6+ characters" autocomplete="${up?'new-password':'current-password'}" style="text-align:left;font-size:16px">
 <p class="s" id="amsg" role="status"></p>
 <button type="button" class="linkbtn" data-act="auth" data-v="${up?'in':'up'}">${up?'Already have an account? Sign in':'New here? Create an account'}</button>`,
 `<button class="no" data-act="close">Cancel</button><button class="yes" data-act="authgo" data-v="${mode}">${up?'Create':'Sign in'}</button>`,'auth');setTimeout(()=>$('ae')?.focus(),60)}
async function authGo(mode){const e=($('ae').value||'').trim(),p=$('ap').value||'',m=$('amsg');
 if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6){m.textContent='Enter your email and a password of at least 6 characters.';return}
 if(!supa){m.textContent="Can't reach the save server right now. Check your connection.";return}
 m.textContent=mode==='up'?'Creating your account…':'Signing in…';
 const isNet=x=>/load failed|failed to fetch|networkerror|network request failed|fetch/i.test(String(x&&(x.message||x)));
 const attempt=()=>mode==='up'?supa.auth.signUp({email:e,password:p}):supa.auth.signInWithPassword({email:e,password:p});
 try{let r;try{r=await attempt();if(r.error&&isNet(r.error))throw r.error}catch(x){if(!isNet(x))throw x;m.textContent='Connection hiccup. Trying again…';await new Promise(z=>setTimeout(z,1200));r=await attempt()}
  if(r.error&&mode==='up'&&/already registered/i.test(r.error.message||'')){const si=await supa.auth.signInWithPassword({email:e,password:p});if(!si.error)r=si}
  if(r.error)throw r.error;
  if(mode==='up'&&!r.data.session){m.textContent='Account created. Tap the confirmation link we emailed you, then come back and sign in.';return}
  cloudUser=r.data.user;closeOv();toast('Signed in as '+e,'good');loadFriends();await cloudPull(0,true);if(ovKind!=='choose')setTimeout(()=>notifyPrompt(true),400)}
 catch(err){const t=String(err.message||'');m.textContent=isNet(err)?"Couldn't reach the save server. Check your connection and tap the button again.":/invalid login/i.test(t)?'That email and password don’t match.':/already registered/i.test(t)?'That email already has an account. Sign in instead.':/confirm/i.test(t)?'Confirm your email first. Check your inbox for the link.':(t||'Something went wrong. Try again.')}}

/* ================= offline: pending earnings ================= */
// After 2 hours without a confirmed time, the game keeps running, but money earned goes to "pending".
// A snapshot is kept: if the phone's clock turns out to have been ahead, the game goes back to it.
let pmToastAt=0,oldDone=false;
function bank(a,quiet){if(!(a>0))return;if(s.pm){s.pm.pend+=a;if(!quiet&&performance.now()-pmToastAt>1500){pmToastAt=performance.now();toast('+'+$m(a)+' added to pending','good')}}else s.cash+=a}
function enterPM(){const t=now();advance(t,true);s.pm={at:t,pend:0,snap:pack(s)};pmWant=false;save();upd()}
function pmShort(b,p){if(gemPay(b)||!s.pm||!(s.pm.pend>0))return false;
 dialog('Not enough cash yet',`<p>This costs <span class="hl">${$m(p)}</span>. You have <span class="hl">${$m(s.cash)}</span> to spend.</p><p class="s">Your <b>${$m(s.pm.pend)} pending</b> is added when you're back online, and you can buy it then.</p>`,`<button class="ok" data-act="close">OK</button>`);return true}
function pmNote(title,body,btn){const a=[title,body,`<button class="ok" data-act="close">${btn}</button>`];if(ovKind){pmLater=a;return}dialog(...a)}
function reconcilePM(real){const p=s.pm;pmWant=false;if(!p)return false;const off=Math.max(0,real-(p.at-OFF_CAP));
 if((s.maxT||0)<=real+5*6e4){const a=p.pend;delete s.pm;s.cash+=a;save();
  if(a>=1)pmNote('Back online',`<p>Your pending earnings are confirmed.</p><p style="font-size:30px;font-weight:900;color:var(--green);margin:4px 0">+${$m(a)}</p><p class="s">Added to your cash. You were offline for <span class="hl">${dur(off/1000)}</span>, and every minute counted.</p>`,'Nice!');return true}
 const snap=unpack(p.snap);if(!snap){delete s.pm;return false}
 snap.maxT=p.at;s=snap;delete s.pm;clockWarned=true;sanitizeTime(s);const r=advance(now(),true);save();const ahead=(s.maxT||0)-real;
 pmNote('Clock check',`<p>Your phone's clock was ahead, so only real time counts.</p>${r.gained>=1?`<p style="font-size:30px;font-weight:900;color:var(--green);margin:4px 0">+${$m(r.gained)}</p>`:''}<p class="s">Progress made offline was replaced with what you really earned while away${r.gained>=1?'':' (nothing yet)'}.${ahead>6e4?` The game is paused for <span class="hl">${dur(ahead/1000)}</span> until real time catches up.`:''}</p>`,'OK');
 upd();return true}
function pmUI(){const on=!!s.pm;let b=$('pbn');
 if(on&&!b){b=document.createElement('div');b.id='pbn';b.className='pbn';b.innerHTML='<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="#F5B946"/></svg><div><b>Offline · earnings are pending</b><span>Keep collecting. It\'s added when you\'re back online.</span></div>';stage.appendChild(b)}
 if(b){b.hidden=!on;if(on){const d=$('duty');b.style.top=(d&&!d.hidden?d.offsetTop+d.offsetHeight+8:12)+'px'}}

/* ================= updates ================= */
// Checks the live site for a newer version. MUST above this BUILD means the update can't be skipped.
let updSnooze=0;
async function checkUpdate(){if(document.hidden||$('updOv')||!/^https?:$/.test(location.protocol))return;
 try{const r=await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'});if(!r.ok)return;
  const m=(await r.text()).match(/\/\*build\*\/const BUILD=(\d+),MUST=(\d+)/);if(!m||+m[1]<=BUILD)return;
  const forced=+m[2]>BUILD;if(!forced&&Date.now()<updSnooze)return;showUpdate(forced)}catch(e){}}
function showUpdate(forced){const d=document.createElement('div');d.id='updOv';d.className='dim';d.style.zIndex=10000;
 d.innerHTML=`<div class="dlg"><h3>Update ready</h3><div class="body"><p>A new version of Trillionaire Tycoon is here.</p><p class="s">${forced?'You need it to keep playing. ':''}Your progress is saved.</p><div class="btns">${forced?'':'<button class="no" id="updLater">Later</button>'}<button class="ok" id="updGo">Update now</button></div></div></div>`;
 document.body.appendChild(d);$('updGo').onclick=()=>{save();$('updGo').textContent='Updating…';location.reload()};
 const l=$('updLater');if(l)l.onclick=()=>{updSnooze=Date.now()+30*6e4;d.remove()}}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,5*6e4);

// offline: keep trying to confirm the time, so pending money is added soon after the signal comes back
setInterval(()=>{if(CLOCK_GUARD&&!clockChecked&&!document.hidden)syncClock()},60000);
addEventListener('online',()=>{if(CLOCK_GUARD&&!clockChecked)syncClock()});
// re-check the time every 10 minutes, and whenever the phone's clock and stopwatch disagree (date changed, or the phone slept)
{let w0=Date.now(),p0=performance.now(),last=performance.now();setInterval(()=>{const w=Date.now(),p=performance.now();
 if(CLOCK_GUARD&&!document.hidden&&(Math.abs((w-w0)-(p-p0))>60000||p-last>10*6e4)){last=p;syncClock()}w0=w;p0=p},2000)}

/* ================= loop ================= */
let lastRank=null,pendingWelcome=null;
function checkAch(){const got=[];for(const[id,t,,f]of ACH){if(!s.ach[id]&&f()){s.ach[id]=1;got.push(t)}}
 if(got.length===1)toast(`${got[0]} complete! Claim your crystals in the mailbox.`,'good');else if(got.length>1)toast(`${got.length} goals complete! Claim your crystals in the mailbox.`,'good');
 const r=myRank();if(lastRank&&r<lastRank){const below=board()[r];toast(`You passed ${below?below[1]:'a rival'}. Now #${r} on the rich list!`,'good')}lastRank=r}
function upd(){hud();if(sigNow()!==stageSig)renderStage();else updStage();
 if(ovKind==='shop'){const sb=$('sb');if(sb)sb.querySelectorAll('[data-act=ask]').forEach(el=>{const b=B[+el.dataset.bid];el.classList.toggle('off',!canPay(b,buyPrice(b)))})}}
function tick(){if(!clockReady){hud();return}if(pmWant&&!s.pm)enterPM();if(pmLater&&!ovKind){const a=pmLater;pmLater=null;dialog(...a)}const wasJ=!!s.jail;advance(now());if(s.dodged&&ovKind!=='splash'){toast(s.dodged>1?`Your get-out-of-jail-free cards kept you out of jail ${s.dodged} times!`:'The police came knocking. Your get-out-of-jail-free card kept you out!','good');s.dodged=0;save()}updPerkUI();if(s.jail&&!wasJ){openJail();vib([60,40,60])}if(s.jail)updJail();checkAch();upd()}
// with an account, catch up only once the server has said what time it really is (or after 6s if offline)
let clockReady=!CLOCK_GUARD;
function catchUp(boot){const wasJ0=!!s.jail;const away=advance(now(),true);
 if(s.name&&away.dt>60000&&(away.gained>0||away.done)){pendingWelcome=[away,!wasJ0&&!!s.jail];if(!boot&&!ovKind){welcome(...pendingWelcome);pendingWelcome=null}}}
function clockGo(){clockWait=false;if(clockReady)return;clockReady=true;catchUp();upd()}
if(clockReady)catchUp(true);else setTimeout(clockGo,6000);
lastRank=myRank();upd();splash();
setInterval(tick,250);setInterval(()=>{if(shownCash!==null&&shownCash<s.cash)hud()},50);setInterval(rain,900);setInterval(save,3000);
addEventListener('resize',()=>{layout();stackN=-1;updStage()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CLOCK_GUARD){clockChecked=false;clockWait=true;setTimeout(()=>{clockWait=false},6000);syncClock()}if(document.hidden){isAway=true;save();if(cloudUser)cloudPush()}else{isAway=false;tick();swReg?.getNotifications?.().then(ns=>ns.forEach(n=>n.close())).catch(()=>{});if(cloudUser)cloudPull(lastPushedAt)}});

setInterval(()=>{const e=$('syncst');if(e)e.textContent=syncText()},1000);
const start=()=>{};window.claude?.hot?.ready?window.claude.hot.ready(start):start();
})();
